name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  xcframework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and zip StackAuditKit.xcframework
        run: scripts/release-xcframework.sh "${GITHUB_REF_NAME#v}"
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/StackAuditKit.xcframework.zip --generate-notes
