name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, e.g. 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, zip and checksum StackAuditKit.xcframework
        run: scripts/release-xcframework.sh "${{ inputs.version }}"
      - name: Commit Package.swift and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release: StackAuditKit ${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD "v${{ inputs.version }}"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" build/release/StackAuditKit.xcframework.zip --generate-notes

  maven-central:
    needs: swift-package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -PVERSION_NAME=${{ inputs.version }}

  gradle-plugin:
    needs: swift-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to the Gradle Plugin Portal
        working-directory: stackaudit-gradle-plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ../gradlew publishPlugins -PVERSION_NAME=${{ inputs.version }} -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"

  cli:
    needs: swift-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the CLI distribution
        run: ./gradlew :stackaudit-cli:distZip -PVERSION_NAME=${{ inputs.version }}
      - name: Attach it to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ inputs.version }}" stackaudit-cli/build/distributions/stackaudit-cli-${{ inputs.version }}.zip
