name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM and Android tests
        run: >
          ./gradlew
          :stackaudit-core:jvmTest
          :stackaudit-ktor:jvmTest
          :stackaudit-noop:jvmTest
          :stackaudit-ktor-noop:jvmTest
          :stackaudit-ui:jvmTest
          :stackaudit-ui:testAndroidHostTest
          :stackaudit-android:testAndroidHostTest
          :stackaudit-cli:test
          compileCommonMainKotlinMetadata
          :sample-android:testDebugUnitTest
          :sample-android:assembleDebug
          --continue
      - name: Gradle plugin tests
        working-directory: stackaudit-gradle-plugin
        run: ../gradlew validatePlugins test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/stackaudit
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin tests on the iOS simulator
        run: ./gradlew :stackaudit-core:iosSimulatorArm64Test :stackaudit-ktor:iosSimulatorArm64Test
      - name: Build StackAuditKit.xcframework
        run: ./gradlew :stackaudit-apple:assembleStackAuditKitDebugXCFramework
      - name: Swift package tests
        run: >
          xcodebuild test
          -scheme StackAudit
          -destination 'platform=iOS Simulator,name=iPhone 16'
      - name: Demo app tests
        run: |
          brew install xcodegen
          cd samples/ios
          xcodegen generate
          xcodebuild test -project StackAuditDemo.xcodeproj -scheme StackAuditDemo -destination 'platform=iOS Simulator,name=iPhone 16'
