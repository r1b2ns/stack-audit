name: Feature request
description: Suggest a new capture source, viewer feature or API
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to debug or inspect, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work. A code snippet of the API you imagine is welcome.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platforms
      multiple: true
      options:
        - Android
        - KMP (shared code)
        - iOS
        - Flutter
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or other tools that already do this.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this
