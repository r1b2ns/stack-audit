name: stack_audit
description: Debug inspector for Flutter apps. Records HTTP (http and Dio), analytics, feature flags and storage, with secrets masked on the device.
version: 0.1.0
repository: https://github.com/r1b2ns/stack-audit/tree/main/flutter/stackaudit
issue_tracker: https://github.com/r1b2ns/stack-audit/issues
topics:
  - debugging
  - network
  - http
  - dio
  - analytics

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.r1b2ns.stackaudit.flutter
        pluginClass: StackAuditPlugin
      ios:
        pluginClass: StackAuditPlugin
